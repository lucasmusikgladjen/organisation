<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>anteckningar.txt</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="toolbar">
    <span class="toolbar-title">C:\anteckningar\</span>
    <button id="btn-new" title="New note">[ + ny ]</button>
    <button id="btn-save" title="Save all positions">[ spara ]</button>
    <span id="save-status"></span>
    <span id="zoom-indicator" title="Double-click to reset zoom">100%</span>
  </div>

  <div id="canvas-container">
    <div id="canvas-scroller">
      <div id="canvas"></div>
    </div>
  </div>

  <!-- New note modal -->
  <div id="new-note-overlay" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-titlebar">
        <span class="modal-title">ny_anteckning.exe</span>
        <button class="new-note-close">[x]</button>
      </div>
      <div class="modal-body">
        <p>Titel:</p>
        <input type="text" id="new-note-title" placeholder="untitled.txt" autocomplete="off">
        <p>Färg:</p>
        <div id="new-note-colors" class="color-picker">
          <!-- Neons & Brights -->
          <button class="color-swatch selected" data-color="#FF00FF" style="background:#FF00FF" title="Magenta"></button>
          <button class="color-swatch" data-color="#00FF00" style="background:#00FF00" title="Lime"></button>
          <button class="color-swatch" data-color="#FF4500" style="background:#FF4500" title="OrangeRed"></button>
          <button class="color-swatch" data-color="#00BFFF" style="background:#00BFFF" title="CyberBlue"></button>
          <button class="color-swatch" data-color="#FFD700" style="background:#FFD700" title="Gold"></button>
          <button class="color-swatch" data-color="#FF1493" style="background:#FF1493" title="HotPink"></button>
          <button class="color-swatch" data-color="#7B00FF" style="background:#7B00FF" title="Electric Purple"></button>
          <button class="color-swatch" data-color="#00FF7F" style="background:#00FF7F" title="Spring Green"></button>
          <button class="color-swatch" data-color="#FF6EC7" style="background:#FF6EC7" title="Neon Pink"></button>
          <button class="color-swatch" data-color="#39FF14" style="background:#39FF14" title="Neon Green"></button>
          <!-- Reds & Oranges -->
          <button class="color-swatch" data-color="#FF0000" style="background:#FF0000" title="Red"></button>
          <button class="color-swatch" data-color="#DC143C" style="background:#DC143C" title="Crimson"></button>
          <button class="color-swatch" data-color="#FF6347" style="background:#FF6347" title="Tomato"></button>
          <button class="color-swatch" data-color="#FF8C00" style="background:#FF8C00" title="Dark Orange"></button>
          <button class="color-swatch" data-color="#FFA500" style="background:#FFA500" title="Orange"></button>
          <!-- Yellows & Warm -->
          <button class="color-swatch" data-color="#FFFF00" style="background:#FFFF00" title="Yellow"></button>
          <button class="color-swatch" data-color="#F0E68C" style="background:#F0E68C" title="Khaki"></button>
          <button class="color-swatch" data-color="#FFDAB9" style="background:#FFDAB9" title="Peach"></button>
          <button class="color-swatch" data-color="#FFB6C1" style="background:#FFB6C1" title="Light Pink"></button>
          <button class="color-swatch" data-color="#E6C9A8" style="background:#E6C9A8" title="Tan"></button>
          <!-- Blues -->
          <button class="color-swatch" data-color="#0000FF" style="background:#0000FF" title="Blue"></button>
          <button class="color-swatch" data-color="#1E90FF" style="background:#1E90FF" title="Dodger Blue"></button>
          <button class="color-swatch" data-color="#4169E1" style="background:#4169E1" title="Royal Blue"></button>
          <button class="color-swatch" data-color="#87CEEB" style="background:#87CEEB" title="Sky Blue"></button>
          <button class="color-swatch" data-color="#00CED1" style="background:#00CED1" title="Dark Turquoise"></button>
          <!-- Greens -->
          <button class="color-swatch" data-color="#008000" style="background:#008000" title="Green"></button>
          <button class="color-swatch" data-color="#2E8B57" style="background:#2E8B57" title="Sea Green"></button>
          <button class="color-swatch" data-color="#20B2AA" style="background:#20B2AA" title="Light Sea Green"></button>
          <button class="color-swatch" data-color="#32CD32" style="background:#32CD32" title="Lime Green"></button>
          <button class="color-swatch" data-color="#6B8E23" style="background:#6B8E23" title="Olive"></button>
          <!-- Purples & Pinks -->
          <button class="color-swatch" data-color="#8A2BE2" style="background:#8A2BE2" title="Blue Violet"></button>
          <button class="color-swatch" data-color="#9400D3" style="background:#9400D3" title="Dark Violet"></button>
          <button class="color-swatch" data-color="#DA70D6" style="background:#DA70D6" title="Orchid"></button>
          <button class="color-swatch" data-color="#C71585" style="background:#C71585" title="Medium Violet Red"></button>
          <button class="color-swatch" data-color="#DB7093" style="background:#DB7093" title="Pale Violet Red"></button>
          <!-- Neutrals & Darks -->
          <button class="color-swatch" data-color="#FFFFFF" style="background:#FFFFFF" title="White"></button>
          <button class="color-swatch" data-color="#C0C0C0" style="background:#C0C0C0" title="Silver"></button>
          <button class="color-swatch" data-color="#808080" style="background:#808080" title="Gray"></button>
          <button class="color-swatch" data-color="#A0522D" style="background:#A0522D" title="Sienna"></button>
          <button class="color-swatch" data-color="#4B0082" style="background:#4B0082" title="Indigo"></button>
        </div>
        <label class="checkbox-label">
          <input type="checkbox" id="new-note-locked">
          Lösenordsskyddad
        </label>
        <div class="modal-buttons">
          <button id="new-note-ok">[ Skapa ]</button>
          <button id="new-note-cancel">[ Avbryt ]</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Password modal -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div id="modal" class="modal">
      <div class="modal-titlebar">
        <span class="modal-title">lösenord.exe</span>
        <button class="modal-close">[x]</button>
      </div>
      <div class="modal-body">
        <p id="modal-message">Enter password:</p>
        <input type="password" id="modal-password" autocomplete="off">
        <div class="modal-buttons">
          <button id="modal-ok">[ OK ]</button>
          <button id="modal-cancel">[ Avbryt ]</button>
        </div>
        <p id="modal-error" class="hidden">* incorrect password *</p>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
